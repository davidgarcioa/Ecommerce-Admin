<header class="testing-header">
  <div class="testing-header__copy">
    <p class="testing-header__eyebrow">Validacion de negocio</p>
    <h2>Testeos</h2>
    <p>Pruebas comerciales, creativas y operativas para validar decisiones.</p>
    <div class="testing-header__meta" aria-label="Estado de testeos">
      <span>
        <span class="material-symbols-rounded" aria-hidden="true">science</span>
        Testing CRUD
      </span>
      <span>
        <span class="material-symbols-rounded" aria-hidden="true">sync</span>
        {{ formatLastUpdated(lastUpdated()) }}
      </span>
    </div>
  </div>

  <div class="testing-header__actions" aria-label="Acciones de testeos">
    <button
      type="button"
      class="testing-header__action"
      (click)="refresh.emit()"
      [disabled]="loading()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
      Actualizar
    </button>
    <button
      type="button"
      class="testing-header__action"
      [class.testing-header__action--active]="filtersVisible() || activeFiltersCount() > 0"
      [attr.aria-expanded]="filtersVisible()"
      (click)="toggleFilters.emit()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">tune</span>
      Filtros
      @if (activeFiltersCount() > 0) {
        <span class="testing-header__count">{{ activeFiltersCount() }}</span>
      }
    </button>
    <button
      type="button"
      class="testing-header__action testing-header__action--primary"
      (click)="create.emit()"
      [disabled]="!canCreate()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">add</span>
      Nuevo testeo
    </button>
  </div>
</header>
