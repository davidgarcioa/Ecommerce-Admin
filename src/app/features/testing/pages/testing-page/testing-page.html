<section class="testing-page" aria-labelledby="testing-title">
  <app-testing-header
    [loading]="loading()"
    [lastUpdated]="lastUpdated()"
    [canCreate]="canCreate()"
    [filtersVisible]="filtersVisible()"
    [activeFiltersCount]="activeFiltersCount()"
    (create)="create()"
    (refresh)="refresh()"
    (toggleFilters)="toggleFilters()"
  />

  @if (filtersVisible()) {
    <div class="testing-page__filters">
      <app-testing-filters
        [filters]="filters()"
        (applyFilters)="applyFilters($event)"
        (clear)="clearFilters()"
      />
    </div>
  }

  <app-testing-summary
    [total]="total()"
    [active]="active()"
    [completed]="completed()"
    [archived]="archived()"
    [draft]="draft()"
    [paused]="paused()"
  />

  <app-data-table
    [data]="tests()"
    [columns]="columns()"
    [loading]="loading()"
    [error]="error()"
    rowIdKey="id"
    [searchable]="false"
    [selectable]="true"
    [rowActions]="rowActions()"
    [exportEnabled]="true"
    [columnSelectorEnabled]="true"
    [preferencesKey]="preferencesKey"
    emptyTitle="Sin testeos"
    emptyDescription="Crea un testeo para validar una hipotesis comercial u operativa."
    (searchChange)="applySearch($event)"
    (retry)="refresh()"
    (rowClick)="openTest($event)"
    (actionClick)="onAction($event)"
  />
</section>
