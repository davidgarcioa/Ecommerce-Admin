<section class="testing-form-page" aria-labelledby="testing-form-title">
  <header><p>Testeos</p><h2 id="testing-form-title">{{ title }}</h2></header>
  @if (error(); as message) { <p class="testing-form-page__error" role="alert">{{ message }}</p> }
  @if (!loading()) {
    <app-testing-form
      [test]="test()"
      [saving]="saving()"
      [validationErrors]="validationErrors()"
      (submitForm)="save($event)"
      (cancel)="cancel()"
    />
  }
</section>
