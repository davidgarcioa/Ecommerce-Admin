<section class="tracking-multiple-results">
  <div class="tracking-multiple-results__header">
    <span class="material-symbols-rounded" aria-hidden="true">list_alt</span>
    <h2>Resultados encontrados</h2>
  </div>

  <div class="tracking-multiple-results__list">
    @for (result of results(); track result.id) {
      <article>
        <div>
          <strong>{{ result.order.orderNumber }}</strong>
          <span>{{ result.customer.name }} · {{ result.customer.city }}</span>
          <small>
            {{ result.shipment.trackingNumber || 'Sin guía' }} ·
            {{ deliveryStatusLabel(result.shipment.deliveryStatus) }}
          </small>
        </div>
        <button type="button" (click)="selectResult.emit(result)">
          <span class="material-symbols-rounded" aria-hidden="true">visibility</span>
          Ver
        </button>
      </article>
    }
  </div>
</section>
