<section class="tracking-search" aria-label="Buscar guia">
  <div class="tracking-search__title">
    <span class="material-symbols-rounded" aria-hidden="true">manage_search</span>
    <div>
      <strong>Buscar guia</strong>
      <p>Escribe solo el numero o la guia completa</p>
    </div>
  </div>

  <div class="tracking-search__controls">
    <label class="tracking-search__field tracking-search__field--query">
      <span>Numero de guia</span>
      <div class="tracking-search__input">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input
          #queryInput
          type="search"
          inputmode="numeric"
          autocomplete="off"
          placeholder="Ej: 890001 o GUIA890001"
          [value]="value()"
          (input)="valueChange.emit(queryInput.value)"
          (keydown.enter)="search.emit()"
        />
      </div>
      <small>Busca por coincidencia exacta o por el numero dentro de la guia.</small>
    </label>

    <div class="tracking-search__actions">
      <button
        type="button"
        class="tracking-search__button tracking-search__button--primary"
        [disabled]="loading()"
        (click)="search.emit()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        Buscar
      </button>
      <button
        type="button"
        class="tracking-search__button"
        [disabled]="loading()"
        (click)="clear.emit()"
      >
        <span class="material-symbols-rounded" aria-hidden="true">restart_alt</span>
        Limpiar
      </button>
    </div>
  </div>

  @if (recentSearches().length > 0) {
    <div class="tracking-search__recent" aria-label="Guias recientes">
      <span class="material-symbols-rounded" aria-hidden="true">history</span>
      @for (item of recentSearches(); track item.searchedAt) {
        <button type="button" (click)="recentSelected.emit(item)">
          {{ item.valueMasked }}
        </button>
      }
    </div>
  }
</section>
