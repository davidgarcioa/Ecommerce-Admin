<div class="tracking-detail-page">
  <button type="button" class="tracking-detail-page__back" (click)="back()">
    <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
    Volver
  </button>

  @if (loading() || searching()) {
    <section class="tracking-detail-page__state" aria-live="polite">
      <span class="material-symbols-rounded" aria-hidden="true">sync</span>
      <div>
        <strong>Cargando rastreo</strong>
        <p>Consultando la información del envío.</p>
      </div>
    </section>
  } @else if (error(); as message) {
    <section class="tracking-detail-page__state tracking-detail-page__state--error" role="alert">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <div>
        <strong>Sin coincidencias</strong>
        <p>{{ message }}</p>
      </div>
    </section>
  } @else if (selected(); as item) {
    <app-tracking-result-summary
      [result]="item"
      [canViewOrder]="canViewOrder()"
      [canViewLogistics]="canViewLogistics()"
      (copyOrder)="copy($event)"
      (copyTracking)="copy($event)"
      (openOffice)="openOffice($event)"
      (openLogistics)="openLogistics($event)"
    />
    <app-tracking-info-cards [result]="item" />
    <app-tracking-timeline [events]="item.timeline" />
  } @else {
    <section class="tracking-detail-page__state tracking-detail-page__state--error">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <div>
        <strong>Sin coincidencias</strong>
        <p>No encontramos resultados con los datos ingresados.</p>
      </div>
    </section>
  }
</div>
