<section class="settings-page" aria-labelledby="role-form-title">
  <header class="settings-page__header">
    <div>
      <h2 id="role-form-title" class="settings-page__title">
        {{ mode() === 'edit' ? 'Editar rol' : 'Nuevo rol' }}
      </h2>
      <p class="settings-page__description">Configura el alcance de trabajo para un perfil interno.</p>
    </div>
    <a class="settings-button" routerLink="/configuracion/roles">Volver</a>
  </header>

  <form class="settings-form settings-card" [formGroup]="form" (ngSubmit)="save()">
    <div class="settings-grid">
      <div class="settings-field">
        <label for="name">Rol</label>
        <select id="name" formControlName="name">
          <option value="">Selecciona un rol</option>
          @for (role of roleOptions; track role) {
            <option [value]="role">{{ role }}</option>
          }
        </select>
      </div>
      <div class="settings-field">
        <label for="description">Descripción</label>
        <textarea id="description" formControlName="description"></textarea>
      </div>
    </div>

    <label class="settings-checkbox">
      <input type="checkbox" formControlName="active" />
      Rol activo
    </label>

    <div>
      <p class="settings-muted">Permisos incluidos</p>
      <div class="settings-permissions">
        @for (permission of permissions(); track permission) {
          <label class="settings-checkbox">
            <input
              type="checkbox"
              [checked]="selectedPermissions().includes(permission)"
              (change)="togglePermission(permission, $event)"
            />
            {{ permission }}
          </label>
        }
      </div>
    </div>

    @if (error()) {
      <p class="settings-muted" role="alert">{{ error() }}</p>
    }

    <div class="settings-page__actions">
      <button type="submit" class="settings-button settings-button--primary" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</section>
