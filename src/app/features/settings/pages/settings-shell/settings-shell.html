<section class="settings-shell" aria-labelledby="settings-title">
  <header class="settings-shell__header">
    <div class="settings-shell__content">
      <p class="settings-shell__eyebrow">Administración</p>
      <h1 id="settings-title">Configuración</h1>
      <span>Consulta la información principal de tu perfil.</span>
    </div>

    <button
      type="button"
      class="settings-shell__refresh"
      (click)="refresh()"
      [disabled]="loading()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">sync</span>
      Actualizar
    </button>
  </header>

  @if (error()) {
    <div class="settings-shell__error" role="alert">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <div>
        <strong>No se pudo sincronizar</strong>
        <p>{{ error() }}</p>
      </div>
    </div>
  }

  <router-outlet />
</section>
