<section class="settings-page" aria-labelledby="users-title">
  <header class="settings-page__header">
    <div>
      <h2 id="users-title" class="settings-page__title">Usuarios</h2>
      <p class="settings-page__description">Administra cuentas internas y sus permisos efectivos.</p>
    </div>
    <div class="settings-page__actions">
      <button type="button" class="settings-button settings-button--primary" (click)="create()">
        <span class="material-symbols-rounded" aria-hidden="true">add</span>
        Nuevo usuario
      </button>
    </div>
  </header>

  <div class="settings-summary" aria-label="Resumen de usuarios">
    <div class="settings-summary-card"><span>Total</span><strong>{{ totalUsers() }}</strong></div>
    <div class="settings-summary-card"><span>Activos</span><strong>{{ activeUsers() }}</strong></div>
    <div class="settings-summary-card"><span>Pendientes</span><strong>{{ pendingUsers() }}</strong></div>
    <div class="settings-summary-card"><span>Inactivos</span><strong>{{ inactiveUsers() }}</strong></div>
  </div>

  <app-data-table
    [data]="users()"
    [columns]="columns()"
    [loading]="loading()"
    [error]="error()"
    rowIdKey="id"
    [rowActions]="rowActions()"
    [selectable]="true"
    [exportEnabled]="true"
    [columnSelectorEnabled]="true"
    preferencesKey="settings-users-table"
    emptyTitle="Sin usuarios"
    emptyDescription="Crea usuarios para controlar el acceso operativo."
    (retry)="refresh()"
    (rowClick)="openUser($event)"
    (actionClick)="onAction($event)"
  />
</section>
