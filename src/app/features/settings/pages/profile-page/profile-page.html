<section class="settings-page" aria-labelledby="profile-title">
  <header class="settings-page__header">
    <div>
      <h2 id="profile-title" class="settings-page__title">Perfil</h2>
      <p class="settings-page__description">Información de la sesión administrativa actual.</p>
    </div>
  </header>

  <article class="settings-card">
    @if (profile(); as currentProfile) {
      <div class="settings-grid">
        <div>
          <p class="settings-muted">Correo</p>
          <strong>{{ currentProfile.email }}</strong>
        </div>
      </div>
    } @else {
      <p class="settings-muted">
        No hay información de perfil disponible. Inicia sesión nuevamente.
      </p>
    }
  </article>
</section>
