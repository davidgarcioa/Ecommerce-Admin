<section class="product-group-products-table">
  <header>
    <div>
      <h2>Productos asociados</h2>
      <p>Productos que alimentan las métricas y rentabilidad del conjunto.</p>
    </div>
  </header>

  <app-data-table
    [data]="products()"
    [columns]="columns()"
    [loading]="loading()"
    [error]="null"
    rowIdKey="id"
    [selectable]="false"
    [sortable]="true"
    [pageable]="true"
    [pageSize]="10"
    [compact]="true"
    emptyTitle="Sin productos asociados"
    emptyDescription="Asocia productos desde la vista de administración de productos del conjunto."
    [rowActions]="actions()"
    (actionClick)="onAction($event)"
  />
</section>
