<header class="product-groups-header">
  <div>
    <p class="product-groups-header__eyebrow">Catálogo operativo</p>
    <h1>Conjuntos</h1>
    <p>Administra grupos de productos, rentabilidad y asociaciones sin salir del módulo.</p>
    @if (lastUpdated(); as date) {
      <span>Actualizado {{ date | date: 'dd/MM/yyyy HH:mm' }}</span>
    }
  </div>

  <div class="product-groups-header__actions">
    <button
      type="button"
      class="button button--ghost"
      [disabled]="loading()"
      (click)="refresh.emit()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
      Actualizar
    </button>
    @if (canCreate()) {
      <button type="button" class="button button--primary" (click)="create.emit()">
        <span class="material-symbols-rounded" aria-hidden="true">add</span>
        Nuevo conjunto
      </button>
    }
  </div>
</header>
