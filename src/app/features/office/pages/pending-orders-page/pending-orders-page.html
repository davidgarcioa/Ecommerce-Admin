<div class="pending-orders-page">
  <header>
    <button type="button" (click)="back()">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      Volver
    </button>
    <div>
      <p>Servicio al cliente</p>
      <h1>Pedidos pendientes</h1>
      <span>Pedidos que todavía requieren confirmación comercial.</span>
    </div>
  </header>

  @if (error(); as message) {
    <section class="pending-orders-page__state" role="alert">
      <strong>No fue posible cargar los pendientes</strong>
      <p>{{ message }}</p>
      <button type="button" (click)="refresh()">Intentar nuevamente</button>
    </section>
  }

  <app-orders-table
    [orders]="orders()"
    [loading]="loading()"
    [canUpdate]="canUpdateOrders()"
    (rowClick)="openOrder($event)"
    (actionClick)="onAction($event)"
    (retry)="refresh()"
  />
</div>
