<app-data-table
  [data]="orders()"
  [columns]="columns()"
  [loading]="loading()"
  [error]="null"
  rowIdKey="id"
  [selectable]="true"
  [multiSelect]="true"
  [sortable]="true"
  [pageable]="true"
  [pageSize]="20"
  [stickyHeader]="true"
  [compact]="true"
  emptyTitle="Sin pedidos"
  emptyDescription="No hay pedidos para los filtros actuales."
  [exportEnabled]="true"
  [columnSelectorEnabled]="true"
  [rowActions]="actions()"
  preferencesKey="office-orders-table-preferences"
  (rowClick)="rowClick.emit($event)"
  (actionClick)="actionClick.emit($event)"
  (selectionChange)="selectionChange.emit($event)"
  (retry)="retry.emit()"
/>
