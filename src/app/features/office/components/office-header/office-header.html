<header class="office-header">
  <div>
    <p class="office-header__eyebrow">Servicio al cliente</p>
    <h1>Oficina</h1>
    <p>Gestión administrativa de pedidos, clientes, pagos y novedades.</p>
    @if (lastUpdated(); as date) {
      <span>Actualizado {{ date | date: 'dd/MM/yyyy HH:mm' }}</span>
    }
  </div>

  <div class="office-header__actions">
    <button type="button" [disabled]="loading()" (click)="openPending.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">pending_actions</span>
      Pendientes
    </button>
    <button type="button" [disabled]="loading()" (click)="refresh.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
      Actualizar
    </button>
  </div>
</header>
