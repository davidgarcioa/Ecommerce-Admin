<div
  class="preferences-backdrop"
  role="presentation"
  (click)="close.emit()"
  (keydown.escape)="close.emit()"
>
  <section
    class="preferences-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="quick-access-preferences-title"
    tabindex="-1"
    (click)="$event.stopPropagation()"
  >
    <header>
      <div>
        <h3 id="quick-access-preferences-title">Personalizar accesos</h3>
        <p>Elige los modulos que quieres ver al iniciar.</p>
      </div>
      <button type="button" aria-label="Cerrar" (click)="close.emit()">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </header>

    <div class="preferences-list" aria-label="Modulos disponibles">
      @for (item of items(); track item.id) {
        <button
          type="button"
          class="preferences-item"
          [class.preferences-item--active]="isSelected(item.id)"
          [attr.aria-pressed]="isSelected(item.id)"
          (click)="toggleItem.emit(item.id)"
        >
          <span class="material-symbols-rounded" aria-hidden="true">{{ item.icon }}</span>
          <span>
            <strong>{{ item.title }}</strong>
            <small>{{ item.description }}</small>
          </span>
          <span class="material-symbols-rounded" aria-hidden="true">
            {{ isSelected(item.id) ? 'check_circle' : 'radio_button_unchecked' }}
          </span>
        </button>
      }
    </div>
  </section>
</div>
