<header class="home-header">
  <div class="home-header__identity">
    <span class="home-header__avatar" aria-hidden="true">
      <span class="material-symbols-rounded">{{ roleIcon() }}</span>
    </span>
    <div>
      <p>{{ currentDate() }}</p>
      <h1>{{ greeting() }}, {{ userName() }}</h1>
      <span>Aquí tienes lo que requiere tu atención.</span>
    </div>
  </div>
</header>
