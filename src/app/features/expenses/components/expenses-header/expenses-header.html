<header class="expenses-header">
  <div>
    <p class="expenses-header__eyebrow">FINANZAS DEL NEGOCIO</p>
    <h1>Gastos</h1>
    <span>Control de caja, presupuesto, egresos y soportes operativos.</span>

    <div class="expenses-header__meta" aria-label="Estado financiero">
      <span>
        <i class="material-symbols-rounded" aria-hidden="true">account_balance</i>
        App financiera
      </span>
      <span>
        <i class="material-symbols-rounded" aria-hidden="true">sync</i>
        {{ formatLastUpdated(lastUpdated()) }}
      </span>
    </div>
  </div>

  <div class="expenses-header__actions" aria-label="Acciones de gastos">
    <button type="button" (click)="refresh.emit()" [disabled]="loading()">
      <span class="material-symbols-rounded" aria-hidden="true">refresh</span>
      Actualizar
    </button>
    <button
      type="button"
      [class.expenses-header__filter--active]="filtersVisible() || activeFiltersCount() > 0"
      (click)="toggleFilters.emit()"
    >
      <span class="material-symbols-rounded" aria-hidden="true">tune</span>
      Filtros
      @if (activeFiltersCount() > 0) {
        <b>{{ activeFiltersCount() }}</b>
      }
    </button>
    <button type="button" class="expenses-header__primary" (click)="create.emit()">
      <span class="material-symbols-rounded" aria-hidden="true">add</span>
      Nuevo movimiento
    </button>
  </div>
</header>
