<section class="expenses-page" aria-labelledby="expenses-title">
  <app-expenses-header
    [loading]="loading()"
    [lastUpdated]="lastUpdated()"
    [filtersVisible]="filtersVisible()"
    [activeFiltersCount]="activeFiltersCount()"
    (create)="create()"
    (refresh)="refresh()"
    (toggleFilters)="toggleFilters()"
  />

  @if (filtersVisible()) {
    <div class="expenses-page__filters">
      <app-expenses-filters
        [search]="search()"
        [filters]="filters()"
        [sort]="sort()"
        (searchChange)="applySearch($event)"
        (filtersChange)="applyFilters($event)"
        (sortChange)="setSort($event)"
        (clear)="clearFilters()"
      />
    </div>
  }

  <app-expenses-summary
    [totalAmount]="totalAmount()"
    [paidAmount]="paidAmount()"
    [pendingAmount]="pendingAmount()"
    [projectedIncome]="projectedIncome()"
    [netCashFlow]="netCashFlow()"
    [budgetAmount]="budgetAmount()"
    [budgetUsedPercentage]="budgetUsedPercentage()"
    [paidRatio]="paidRatio()"
    [pendingCount]="pendingCount()"
    [overdueAmount]="overdueAmount()"
    [dueSoonAmount]="dueSoonAmount()"
    [expenseCount]="totalExpenses()"
    [averageExpense]="averageExpense()"
    [topCategory]="topCategoryLabel()"
    [withoutReceipt]="withoutReceiptCount()"
    [categoryBreakdown]="categoryBreakdown()"
    [loading]="loading()"
  />

  @if (error(); as message) {
    <section class="expenses-page__error" role="alert">
      <span class="material-symbols-rounded" aria-hidden="true">error</span>
      <div>
        <strong>No fue posible cargar la app financiera</strong>
        <p>{{ message }}</p>
      </div>
      <button type="button" (click)="refresh()">Intentar nuevamente</button>
    </section>
  }

  <app-data-table
    [data]="expenses()"
    [columns]="columns()"
    [loading]="loading()"
    [error]="null"
    rowIdKey="id"
    [searchable]="false"
    [selectable]="true"
    [multiSelect]="true"
    [sortable]="true"
    [pageable]="true"
    [pageSize]="20"
    [stickyHeader]="true"
    [compact]="true"
    emptyTitle="Sin movimientos financieros"
    emptyDescription="Registra un gasto para controlar caja, presupuesto y soportes."
    [exportEnabled]="true"
    [columnSelectorEnabled]="true"
    [rowActions]="rowActions()"
    [preferencesKey]="preferencesKey"
    (rowClick)="openExpense($event)"
    (actionClick)="onAction($event)"
    (retry)="refresh()"
  />
</section>
