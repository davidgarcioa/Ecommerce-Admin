<section class="expense-detail-page">
  <button type="button" class="expense-detail-page__back" routerLink="/gastos">
    <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
    Volver
  </button>

  @if (loading()) {
    <p>Cargando movimiento financiero...</p>
  } @else if (error(); as message) {
    <p role="alert">{{ message }}</p>
  } @else if (expense(); as currentExpense) {
    <app-expense-detail-card
      [expense]="currentExpense"
      (edit)="edit($event)"
      (delete)="delete($event)"
    />
  } @else {
    <p>No encontramos el movimiento solicitado.</p>
  }
</section>
