<section class="expense-form-page">
  <header>
    <button type="button" (click)="cancel()">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      Volver
    </button>
    <div>
      <p>FINANZAS DEL NEGOCIO</p>
      <h1>{{ mode === 'create' ? 'Nuevo movimiento' : 'Editar movimiento' }}</h1>
      <span>Registra egresos, pagos pendientes, soportes y responsables.</span>
    </div>
  </header>

  <app-expense-form
    [expense]="expense()"
    [saving]="saving()"
    [error]="error()"
    [mode]="mode"
    (cancel)="cancel()"
    (create)="create($event)"
    (update)="update($event)"
  />
</section>
