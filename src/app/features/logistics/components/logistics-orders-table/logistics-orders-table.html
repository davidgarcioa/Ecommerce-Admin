<app-data-table
  [data]="orders()"
  [columns]="columns()"
  [loading]="loading()"
  [error]="null"
  rowIdKey="id"
  [searchable]="false"
  [selectable]="true"
  [multiSelect]="true"
  [sortable]="true"
  [pageable]="true"
  [pageSize]="20"
  [stickyHeader]="true"
  [compact]="true"
  emptyTitle="Sin pedidos logisticos"
  emptyDescription="No hay pedidos para los filtros actuales."
  [exportEnabled]="true"
  [columnSelectorEnabled]="true"
  [rowActions]="actions()"
  [preferencesKey]="preferencesKey"
  (rowClick)="rowClick.emit($event)"
  (actionClick)="actionClick.emit($event)"
  (retry)="retry.emit()"
/>
