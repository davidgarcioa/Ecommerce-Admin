<div class="logistics-subpage">
  <header>
    <button type="button" (click)="back()">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      Volver
    </button>
    <div>
      <p>Torre Logística</p>
      <h1>Pendientes de despacho</h1>
      <span>Pedidos confirmados que aún no tienen avance de entrega.</span>
    </div>
  </header>

  @if (error(); as message) {
    <section class="logistics-subpage__state" role="alert">{{ message }}</section>
  }

  <app-logistics-orders-table
    [orders]="orders()"
    [loading]="loading()"
    [canUpdate]="canUpdateShipment()"
    (rowClick)="openOrder($event)"
    (retry)="refresh()"
  />
</div>
