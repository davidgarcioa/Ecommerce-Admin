<div class="logistics-page">
  <app-logistics-header
    [loading]="loading()"
    [lastUpdated]="lastUpdated()"
    [incidentCount]="ordersWithIncidents()"
    [filtersOpen]="filtersOpen()"
    [activeFilterCount]="activeFilterCount()"
    (refresh)="refresh()"
    (openPending)="openPending()"
    (openIncidents)="openIncidents()"
    (toggleFilters)="toggleFilters()"
  />

  <app-logistics-summary
    [pending]="pendingDispatches()"
    [ready]="readyForDispatch()"
    [inTransit]="inTransitOrders()"
    [deliveredToday]="deliveredToday()"
    [failed]="failedDeliveries()"
    [incidents]="ordersWithIncidents()"
    [inReturn]="pendingReturns()"
    [returned]="returnedOrders()"
  />

  @if (filtersOpen()) {
    <div class="logistics-page__filters">
      <app-logistics-filters
        [search]="search()"
        [filters]="filters()"
        (apply)="applyFilterState($event)"
        (clear)="clearFilters()"
      />
    </div>
  }

  @if (error(); as message) {
    <section class="logistics-page__state" role="alert">
      <strong>No fue posible cargar Torre Logistica</strong>
      <p>{{ message }}</p>
      <button type="button" (click)="refresh()">Intentar nuevamente</button>
    </section>
  }

  <app-logistics-orders-table
    [orders]="orders()"
    [loading]="loading()"
    [canUpdate]="canUpdateShipment()"
    (rowClick)="openOrder($event)"
    (actionClick)="onAction($event)"
    (retry)="refresh()"
  />
</div>
